<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni System - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">Alumni Network</a>
            <div>
                <a href="dashboard.html" class="btn btn-sm btn-outline-light me-2">Home</a>
                <a href="login.html" class="btn btn-sm btn-light">Login</a>
            </div>
        </div>
    </nav>

    <div class="hero">
        <header>
            <h2>Create your alumni account</h2>
        </header>

        <nav>
            <a href="dashboard.html">Home</a> |
            <a href="login.html">Login</a>
        </nav>

        <main>
            <form action="#" method="post">
                <label for="fullname">Full Name</label><br>
                <input type="text" id="fullname" name="fullname"><br>

                <label for="batch">Graduation Year</label><br>
                <input type="number" id="batch" name="batch"><br>

                <label for="email">Email</label><br>
                <input type="email" id="email" name="email"><br>

                <label for="password">Password</label><br>
                <input type="password" id="password" name="password"><br>

                <label for="confirm_password">Confirm Password</label><br>
                <input type="password" id="confirm_password" name="confirm_password"><br>

                <button type="submit" class="btn">Register</button>
            </form>

            <p>Already have an account? <a href="login.html">Login here</a>.</p>
        </main>

        <footer>
            <p>&copy; 2026 Alumni Management System</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
