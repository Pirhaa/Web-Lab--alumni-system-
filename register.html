<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Alumni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Alumni Management System</h1>
    </header>

    <nav>
        <a href="dashboard.html">Home</a>
        <a href="alumni.html">Alumni</a>
        <a href="profile.html">Profile</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

    <div class="hero">
        <header>
            <h1>Register</h1>
            <h2>Create your alumni account</h2>
        </header>

        <main>
            <div class="form-container">
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>

                    <div class="form-group">
                        <label for="batch">Graduation Year</label>
                        <input type="number" id="batch" name="batch" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>

                    <button type="submit" class="btn">Register</button>
                </form>

                <p class="form-footer">
                    Already have an account? <a href="login.html">Login here</a>.
                </p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Alumni Management System</p>
        </footer>
    </div>

</body>
</html>
